<!DOCTYPE html>
<html lang="vi" class="h-full bg-slate-50">

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATS - Recruitment Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    body {
      font-family: 'Inter', sans-serif;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    .animate-fade-in {
      animation: fadeIn .2s ease-in-out;

    @keyframes fadeIn {

        transform: translateY(4px);

      to {

    .kanban-card {
      cursor: grab;

    .kanban-card.dragging {

      display: none !important;

<body class="h-full bg-slate-50 text-slate-800 antialiased">

  <div id="toast-container" class="fixed top-4 right-4 z-[100] flex flex-col gap-2 max-w-sm w-full pointer-events-none">
  </div>

  <!-- ============ AUTH SCREEN ============ -->
  <div id="auth-screen" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 max-w-md w-full p-8">
      <div class="flex items-center gap-3 mb-6">
        <div class="w-11 h-11 bg-indigo-600 rounded-xl flex items-center justify-center text-white text-xl">
          <i class="fa-solid fa-users-gear"></i>
        </div>
        <div>
          <h1 class="font-extrabold text-lg leading-tight">ATS</h1>
          <span class="text-[11px] text-slate-400 font-semibold uppercase tracking-wide">Recruitment Management</span>
        </div>
      </div>

      <div class="flex gap-2 mb-6 bg-slate-100 p-1 rounded-xl">
        <button id="auth-tab-login" onclick="setAuthMode('login')"
          class="flex-1 py-2 rounded-lg text-sm font-bold transition">Đăng nhập</button>
        <button id="auth-tab-register" onclick="setAuthMode('register')"
          class="flex-1 py-2 rounded-lg text-sm font-bold transition">Đăng ký (Ứng viên)</button>
      </div>

      <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Email</label>
          <input type="email" id="login-email" required
            class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Mật khẩu</label>
          <div class="relative">
            <input type="password" id="login-password" required
              class="w-full px-3.5 py-2.5 pr-10 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            <button type="button" onclick="togglePasswordVisibility('login-password', this)"
              class="absolute inset-y-0 right-0 px-3 text-slate-400 hover:text-slate-600" tabindex="-1"><i
                class="fa-solid fa-eye"></i></button>
          </div>
        </div>
        <div class="text-right -mt-2">
          <a href="#" onclick="openForgotPasswordModal();return false;"
            class="text-xs font-semibold text-indigo-600 hover:underline">Quên mật khẩu?</a>
        </div>
        <button type="submit"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl text-sm font-bold shadow-sm">Đăng
          nhập</button>
      </form>

      <form id="register-form" onsubmit="handleRegister(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Họ và tên</label>
          <input type="text" id="reg-fullname" required
            class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Email</label>
          <input type="email" id="reg-email" required
            class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Số điện thoại</label>
          <input type="text" id="reg-phone"
            class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Mật khẩu (tối thiểu 8 ký tự, có chữ và
            số)</label>
          <div class="relative">
            <input type="password" id="reg-password" required minlength="8"
              class="w-full px-3.5 py-2.5 pr-10 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            <button type="button" onclick="togglePasswordVisibility('reg-password', this)"
              class="absolute inset-y-0 right-0 px-3 text-slate-400 hover:text-slate-600" tabindex="-1"><i
                class="fa-solid fa-eye"></i></button>
          </div>
        </div>
        <button type="submit"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl text-sm font-bold shadow-sm">Tạo

  <!-- ============ APP SHELL ============ -->
  <div id="app-shell" class="hidden h-screen w-full flex overflow-hidden">
    <aside class="w-64 bg-slate-900 text-white flex flex-col justify-between shrink-0">
      <div>
        <div class="p-5 flex items-center gap-3 border-b border-slate-800">
          <div class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center"><i
              class="fa-solid fa-users-gear"></i></div>
          <div>
            <h1 class="font-bold text-base leading-tight">ATS</h1>
            <span class="text-[10px] text-indigo-400 font-bold uppercase tracking-wider">Recruitment Management</span>
          </div>
        </div>
        <nav id="sidebar-nav" class="p-3 space-y-1"></nav>
      </div>
      <div class="p-4 border-t border-slate-800 bg-slate-950/60">
        <div class="flex items-center gap-3 mb-3">
          <div
            class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center font-bold text-xs"
            id="user-avatar">??</div>
          <div class="overflow-hidden">
            <h4 id="user-name" class="font-semibold text-xs text-slate-200 truncate">-</h4>

    <main class="flex-1 flex flex-col min-w-0 overflow-hidden">
      <header class="h-16 border-b border-slate-200 bg-white flex items-center justify-between px-6 shrink-0">
        <h2 id="page-title" class="text-lg font-bold text-slate-800">-</h2>
        <div id="header-actions" class="flex items-center gap-2"></div>
      </header>
      <div class="flex-1 overflow-y-auto p-6" id="tab-content"></div>
    </main>
  </div>

  <!-- ============ MODALS ============ -->
  <div id="modal-root"></div>

  <script>
    /* ==================================================================
       STATE & API HELPER
       ================================================================== */
    const state = {
      accessToken: sessionStorage.getItem('ats_access_token') || null,
      refreshToken: sessionStorage.getItem('ats_refresh_token') || null,
      currentUser: null,
      activeTab: null,
      cache: { departments: [], jobs: [], applications: [] },
    };

    const STATUS_LABEL = {
      NEW: 'Mới nộp', SCREENING: 'Đang sàng lọc',
      SHORTLISTED: 'Đã shortlist', INTERVIEW: 'Phỏng vấn', OFFER: 'Đã gửi Offer',
      HIRED: 'Đã tuyển', REJECTED: 'Từ chối', WITHDRAWN: 'Đã rút hồ sơ', ARCHIVED: 'Lưu trữ',
    };
    const OFFER_STATUS_LABEL = {
      DRAFT: 'Nháp', PENDING_APPROVAL: 'Chờ duyệt', APPROVED: 'Đã duyệt', SENT: 'Đã gửi ứng viên',
      ACCEPTED: 'Ứng viên đã nhận', DECLINED: 'Ứng viên từ chối', EXPIRED: 'Hết hạn',
    };
    const ROLE_LABEL = { HR: 'HR', HR_MANAGER: 'HR Manager', ADMIN: 'Admin' };
    const JOB_STATUS_LABEL = {
      DRAFT: 'Nháp', PENDING_APPROVAL: 'Chờ duyệt', APPROVED: 'Đã duyệt',
      PUBLISHED: 'Đang tuyển', CLOSED: 'Đã đóng', CANCELLED: 'Đã hủy',
    };
    // Dung chung cho cac trang quan ly co trang thai don gian ACTIVE/INACTIVE
    // (Mau Email, Nguon ung vien, Doi ngu HR/Quan ly tai khoan) + LOCKED rieng
    // cho User - de dong nhat ngon ngu, khong con hien tieng Anh tho.
    const SIMPLE_STATUS_LABEL = { ACTIVE: 'Đang hoạt động', INACTIVE: 'Đã vô hiệu hóa', LOCKED: 'Đã khóa' };
    // Pham vi vai tro duoc phep tao/gan - PHAI khop dung _ROLES_HR_MANAGER_CAN_CREATE/
    // _ROLES_ADMIN_CAN_CREATE trong app/routers/users.py, neu khong dropdown se cho
    // chon 1 vai tro ma backend se tu choi 403 khi submit.
    const ROLES_MANAGEABLE_BY = {
      ADMIN: ['HR', 'HR_MANAGER', 'ADMIN'],
      HR_MANAGER: ['HR'],
    };
    // Thu tu pipeline - dung de biet 1 lan doi trang thai la forward hay backward (khop app/services/application_service.py)
    const PIPELINE_ORDER = ['NEW', 'SCREENING', 'SHORTLISTED', 'INTERVIEW', 'OFFER', 'HIRED'];
    const KANBAN_COLUMNS = ['NEW', 'SCREENING', 'SHORTLISTED', 'INTERVIEW', 'OFFER', 'HIRED', 'REJECTED', 'WITHDRAWN', 'ARCHIVED'];

    async function api(path, { method = 'GET', body, headers = {}, retry = true } = {}) {
      const finalHeaders = { ...headers };
      if (body !== undefined) finalHeaders['Content-Type'] = 'application/json';
      if (state.accessToken) finalHeaders['Authorization'] = `Bearer ${state.accessToken}`;

      const res = await fetch(path, {
        method,
        headers: finalHeaders,
        body: body !== undefined ? JSON.stringify(body) : undefined,
      });

      if (res.status === 401 && retry && state.refreshToken) {
        const ok = await tryRefreshToken();
        if (ok) return api(path, { method, body, headers, retry: false });
      }

      if (!res.ok) {
        let detail = res.statusText;
        try { const j = await res.json(); if (j.detail) detail = typeof j.detail === 'string' ? j.detail : JSON.stringify(j.detail); } catch (e) { }
        const err = new Error(detail);
        err.status = res.status;
        throw err;
      }
      if (res.status === 204) return null;
      return res.json();
    }

    async function apiUploadFile(path, file, retry = true) {
      const formData = new FormData();
      formData.append('file', file);
      const headers = {};
      if (state.accessToken) headers['Authorization'] = `Bearer ${state.accessToken}`;
      // KHONG set Content-Type thu cong - trinh duyet tu them boundary cho multipart/form-data.
      const res = await fetch(path, { method: 'POST', headers, body: formData });

      if (res.status === 401 && retry && state.refreshToken) {
        const ok = await tryRefreshToken();
        if (ok) return apiUploadFile(path, file, false);
      }
      if (!res.ok) {
        let detail = res.statusText;
        try { const j = await res.json(); if (j.detail) detail = j.detail; } catch (e) { }
        const err = new Error(detail);
        err.status = res.status;
        throw err;
      }
      return res.json();
    }

    // tai file that ve may qua GET /resumes/{id}/download -
    // endpoint yeu cau Bearer token (khong the dung the <a href> tho vi trinh
    // duyet khong dinh kem Authorization header cho request dieu huong thuong).
    async function apiDownloadFile(path, suggestedFileName) {
      const headers = {};
      if (state.accessToken) headers['Authorization'] = `Bearer ${state.accessToken}`;
      const res = await fetch(path, { headers });
      if (!res.ok) {
        let detail = res.statusText;
        try { const j = await res.json(); if (j.detail) detail = j.detail; } catch (e) { }
        const err = new Error(detail);
        err.status = res.status;
        throw err;
      }
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = suggestedFileName || 'download';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    async function tryRefreshToken() {
      try {
        const res = await fetch('/auth/refresh', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ refresh_token: state.refreshToken }),
        });
        if (!res.ok) return false;
        const data = await res.json();
        state.accessToken = data.access_token;
        sessionStorage.setItem('ats_access_token', state.accessToken);
        return true;
      } catch (e) { return false; }
    }

    /* ==================================================================
       TOAST / CONFIRM
       ================================================================== */
    function showToast(message, type = 'info') {
      const c = document.getElementById('toast-container');
      const el = document.createElement('div');
      const styles = { success: 'bg-emerald-600', error: 'bg-rose-600', info: 'bg-slate-800' };
      el.className = `${styles[type] || styles.info} text-white px-4 py-3 rounded-xl shadow-lg text-xs font-semibold animate-fade-in pointer-events-auto`;
      el.textContent = message;
      c.appendChild(el);
      setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, 3500);
    }

    function apiErrorToast(err, prefix = '') {
      console.error(err);
      showToast(`${prefix}${err.message || 'Đã có lỗi xảy ra'}`, 'error');
    }

    function closeModal() {
      // Form "Sua ung vien" phai canh bao khi rot khoi ma chua luu (ke ca bam
      // ra ngoai modal/backdrop, khong chi nut Huy) - dat guard o
      // day (dung chung 1 diem thoat cua moi modal) thay vi rieng tung noi goi.
      if (typeof candidateEditDirty !== 'undefined' && candidateEditDirty) {
        if (!confirm('Bạn có thay đổi chưa được lưu. Bạn có chắc muốn rời khỏi?')) return;
        candidateEditDirty = false;
      }
      document.getElementById('modal-root').innerHTML = '';
    }

    function renderModal(innerHtml, widthClass = 'max-w-lg') {
      document.getElementById('modal-root').innerHTML = `
    <div class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4" onclick="if(event.target===this) closeModal()">
      <div class="bg-white rounded-2xl shadow-2xl ${widthClass} w-full max-h-[90vh] overflow-y-auto">${innerHtml}</div>
    </div>`;
    }

    /* ==================================================================
       AUTH
       ================================================================== */
    function setAuthMode(mode) {
      const loginTab = document.getElementById('auth-tab-login');
      const regTab = document.getElementById('auth-tab-register');
      const loginForm = document.getElementById('login-form');
      const regForm = document.getElementById('register-form');
      const active = 'bg-white text-indigo-600 shadow-sm';
      const inactive = 'text-slate-500';
      if (mode === 'login') {
        loginTab.className = `flex-1 py-2 rounded-lg text-sm font-bold transition ${active}`;
        regTab.className = `flex-1 py-2 rounded-lg text-sm font-bold transition ${inactive}`;
        loginForm.classList.remove('hidden'); regForm.classList.add('hidden');
      } else {
        regTab.className = `flex-1 py-2 rounded-lg text-sm font-bold transition ${active}`;
        loginTab.className = `flex-1 py-2 rounded-lg text-sm font-bold transition ${inactive}`;
        regForm.classList.remove('hidden'); loginForm.classList.add('hidden');
      }
    }

    function setTokens(data) {
      state.accessToken = data.access_token;
      sessionStorage.setItem('ats_access_token', state.accessToken);
      if (data.refresh_token) {
        state.refreshToken = data.refresh_token;
        sessionStorage.setItem('ats_refresh_token', state.refreshToken);
      }
    }

    async function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      try {
        const data = await api('/auth/login', { method: 'POST', body: { email, password } });
        setTokens(data);
        await bootstrap();
      } catch (err) { showToast(translateAuthError(err), 'error'); }
    }

    async function handleRegister(event) {
      event.preventDefault();
      const payload = {
        full_name: document.getElementById('reg-fullname').value,
        email: document.getElementById('reg-email').value,
        phone: document.getElementById('reg-phone').value || null,
        password: document.getElementById('reg-password').value,
      };
      try {
        const data = await api('/auth/register', { method: 'POST', body: payload });
        setTokens(data);
        await bootstrap();
      } catch (err) { showToast(translateAuthError(err), 'error'); }
    }

    /* ==================================================================
       PASSWORD SHOW/HIDE + FORGOT/RESET PASSWORD
       ================================================================== */
    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      btn.innerHTML = isHidden ? '<i class="fa-solid fa-eye-slash"></i>' : '<i class="fa-solid fa-eye"></i>';
    }

    // Thong bao loi Candidate Account phai tieng Viet, khong lo SQL/JWT/
    // bcrypt/500 raw. Khong doan chinh xac tung truong hop - chi map cac ma
    // loi da biet tu backend, con lai fallback ve 1 cau chung chung an toan.
    const AUTH_ERROR_VI = {
      EMAIL_ALREADY_REGISTERED: 'Email này đã được sử dụng. Vui lòng sử dụng email khác hoặc chọn "Quên mật khẩu".',
      INVALID_CREDENTIALS: 'Tài khoản hoặc mật khẩu không hợp lệ.',
      ACCOUNT_NOT_ACTIVE: 'Tài khoản của bạn hiện không hoạt động. Vui lòng liên hệ quản trị viên.',
      PASSWORD_MUST_CONTAIN_LETTER_AND_DIGIT: 'Mật khẩu phải bao gồm ít nhất chữ và số.',
      INVALID_OR_EXPIRED_RESET_TOKEN: 'Liên kết đặt lại mật khẩu không hợp lệ hoặc đã hết hạn. Vui lòng yêu cầu lại.',
      INVALID_REFRESH_TOKEN: 'Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.',
      REFRESH_TOKEN_EXPIRED: 'Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.',
    };

    function translateAuthError(err) {
      let raw = err.message || '';
      const m = raw.match(/Value error,\s*(.+)/);
      if (m) raw = m[1].trim();
      for (const code of Object.keys(AUTH_ERROR_VI)) {
        if (raw.includes(code)) return AUTH_ERROR_VI[code];
      }
      if (raw.toLowerCase().includes('email')) return 'Email không hợp lệ.';
      if (err.status === 422) return 'Thông tin nhập chưa hợp lệ. Vui lòng kiểm tra lại.';
      return 'Đã có lỗi xảy ra. Vui lòng thử lại sau.';
    }

    function openForgotPasswordModal() {
      renderModal(`
    <div class="p-5 border-b border-slate-100 flex justify-between items-center">
      <h3 class="font-bold text-lg">Quên mật khẩu</h3>
      <button onclick="closeModal()"><i class="fa-solid fa-xmark text-xl text-slate-400"></i></button>
    </div>
    <form onsubmit="handleForgotPassword(event)" class="p-6 space-y-4">
      <p class="text-xs text-slate-500">Nhập email đã đăng ký, chúng tôi sẽ gửi hướng dẫn đặt lại mật khẩu nếu tài khoản tồn tại.</p>
      <div><label class="block text-xs font-bold uppercase text-slate-500 mb-1">Email</label>
        <input type="email" id="forgot-email" required class="w-full px-3.5 py-2 border border-slate-200 rounded-xl text-sm"></div>
      <div class="pt-2 flex justify-end gap-3">
        <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-200 rounded-xl text-sm font-semibold">Hủy</button>
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-xl text-sm font-bold">Gửi yêu cầu</button>
      </div>
    </form>`);
    }

    async function handleForgotPassword(event) {
      event.preventDefault();
      const email = val('forgot-email');
      try {
        const data = await api('/auth/forgot-password', { method: 'POST', body: { email } });
        closeModal();
        // Phan hoi trung tinh - khong tiet lo email co ton tai hay khong.
        showToast(data.message, 'success');
      } catch (err) { showToast(translateAuthError(err), 'error'); }
    }

    function openResetPasswordModal(prefilledToken = '') {
      renderModal(`
    <div class="p-5 border-b border-slate-100 flex justify-between items-center">
      <h3 class="font-bold text-lg">Đặt lại mật khẩu</h3>
      <button onclick="closeModal()"><i class="fa-solid fa-xmark text-xl text-slate-400"></i></button>
    </div>
    <form onsubmit="handleResetPassword(event)" class="p-6 space-y-4">
      <div><label class="block text-xs font-bold uppercase text-slate-500 mb-1">Mã đặt lại mật khẩu (từ email)</label>
        <input id="reset-token" required value="${escapeHtml(prefilledToken)}" class="w-full px-3.5 py-2 border border-slate-200 rounded-xl text-sm"></div>
      <div><label class="block text-xs font-bold uppercase text-slate-500 mb-1">Mật khẩu mới (tối thiểu 8 ký tự, có chữ và số)</label>
        <div class="relative">
          <input type="password" id="reset-new-password" required minlength="8" class="w-full px-3.5 py-2 pr-10 border border-slate-200 rounded-xl text-sm">

    async function handleResetPassword(event) {
      event.preventDefault();
      const newPassword = val('reset-new-password');
      const confirmPassword = val('reset-confirm-password');
      if (newPassword !== confirmPassword) {
        showToast('Mật khẩu xác nhận không khớp.', 'error');
        return;
      }
      try {
        const data = await api('/auth/reset-password', { method: 'POST', body: { token: val('reset-token'), new_password: newPassword } });
        closeModal();
        showToast(data.message, 'success');
        setAuthMode('login');
      } catch (err) { showToast(translateAuthError(err), 'error'); }
    }

    function logout() {
      state.accessToken = null; state.refreshToken = null; state.currentUser = null;
      sessionStorage.removeItem('ats_access_token'); sessionStorage.removeItem('ats_refresh_token');
      document.getElementById('app-shell').classList.add('hidden');
      document.getElementById('auth-screen').classList.remove('hidden');
      setAuthMode('login');
    }

    async function bootstrap() {
      if (!state.accessToken) { document.getElementById('auth-screen').classList.remove('hidden'); document.getElementById('app-shell').classList.add('hidden'); return; }
      try {
        state.currentUser = await api('/auth/me');
      } catch (err) {
        logout(); return;
      }
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('app-shell').classList.remove('hidden');
      renderShell();
    }

    async function openApplyModal(jobBusinessId) {

      const u = state.currentUser;
      // Nguon ho so lay tu System Configuration -> Candidate Sources, khong

      try { sources = (await api('/candidate-sources')).filter(s => s.status === 'ACTIVE'); } catch (e) { }

      renderModal(`

      <div><label class="block text-xs font-bold uppercase text-slate-500 mb-1">Nguồn hồ sơ *</label>
        <select id="apply-source" required class="w-full px-3.5 py-2 border border-slate-200 rounded-xl text-sm">
          <option value="">- Vui lòng chọn nguồn hồ sơ -</option>
          ${sources.map(s => `<option value="${s.business_id}">${escapeHtml(s.name)}</option>`).join('')}
        </select>
        ${!sources.length ? '<p class="text-[11px] text-amber-600 mt-1">Hệ thống chưa cấu hình Nguồn hồ sơ nào - liên hệ quản trị viên.</p>' : ''}</div>

      <label class="flex items-start gap-2 text-xs text-slate-600 bg-slate-50 p-3 rounded-xl border border-slate-200">
        <input type="checkbox" id="apply-ai-consent" required class="mt-0.5">
        <span>Tôi đồng ý cho hồ sơ của mình được xử lý bởi hệ thống AI để đánh giá mức độ phù hợp với vị trí ứng tuyển.</span>
      </label>
      <div class="pt-2 flex justify-end gap-3">

      </div>
    </form>`);
    }

    async function handleApply(event, jobBusinessId) {
      event.preventDefault();
      const sourceBusinessId = val('apply-source');
      if (!sourceBusinessId) {
        // Khong cho submit neu chua chon source.
        showToast('Vui lòng chọn nguồn hồ sơ.', 'error');
        return;
      }
      const payload = {
        job_business_id: jobBusinessId,
        candidate_full_name: val('apply-fullname'),
        candidate_email: val('apply-email'),
        candidate_phone: val('apply-phone'),
        source_business_id: sourceBusinessId,
        ai_consent: document.getElementById('apply-ai-consent').checked,
        resume_text: val('apply-resume-text') || null,
      };
      const fileInput = document.getElementById('apply-resume-file');
      const resumeFile = fileInput && fileInput.files.length ? fileInput.files[0] : null;

      try {
        const app = await api('/applications', {
          method: 'POST', body: payload,
          headers: { 'Idempotency-Key': currentApplyIdempotencyKey },
        });

        if (resumeFile) {
          try {
            await apiUploadFile(`/applications/${app.business_id}/resume`, resumeFile);
          } catch (uploadErr) {
            apiErrorToast(uploadErr, 'Đã nộp hồ sơ nhưng upload CV thất bại: ');
          }
        }

        closeModal();
        openApplyConfirmation(app);
      } catch (err) { showToast(`Nộp hồ sơ thất bại: ${translateApplyError(err)}`, 'error'); }
    }

    function translateApplyError(err) {
      const msg = err.message || '';
      if (msg.startsWith('ALREADY_HAS_ACTIVE_APPLICATION_FOR_THIS_JOB')) {
        return 'Bạn đang có một hồ sơ khác cho vị trí này đang được xử lý (đã qua bước sàng lọc) - vui lòng chờ kết quả hồ sơ hiện tại trước khi nộp lại.';
      }
      return msg || 'Đã có lỗi xảy ra.';
    }

      renderModal(`

      <div class="bg-slate-50 rounded-xl p-4 text-left text-sm space-y-1.5 border border-slate-200">

    /* ==================================================================
       SUA THONG TIN CA NHAN (Candidate tu sua) - backend PUT /candidates/{id}
       da RBAC san (candidate.user_id == current_user.id), tab "Ho so cua toi"
       chi hien nut nay khi da co it nhat 1 Application (Candidate record chi
       duoc tao luc apply lan dau - get-or-create theo email trong
       application_service, xem candidate_service._get_or_create_candidate).
       ================================================================== */
    async function openMyProfileEditModal(candidateBusinessId) {
      let candidate;
      try { candidate = await api(`/candidates/${candidateBusinessId}`); } catch (err) { apiErrorToast(err, 'Không tải được thông tin cá nhân: '); return; }

      renderModal(`
    <div class="p-5 border-b border-slate-100 flex justify-between items-center">
      <h3 class="font-bold text-lg">Sửa thông tin cá nhân</h3>
      <button onclick="closeModal()"><i class="fa-solid fa-xmark text-xl text-slate-400"></i></button>
    </div>
    <form onsubmit="handleSaveMyProfile(event, '${candidate.business_id}')" class="p-6 space-y-3">
      <div><label class="block text-xs font-bold uppercase text-slate-500 mb-1">Họ tên *</label>
        <input id="mp-fullname" required value="${escapeHtml(candidate.full_name)}" class="w-full px-3.5 py-2 border border-slate-200 rounded-xl text-sm"></div>
      <div><label class="block text-xs font-bold uppercase text-slate-500 mb-1">Giới tính</label>
        <select id="mp-gender" class="w-full px-3.5 py-2 border border-slate-200 rounded-xl text-sm">
          <option value="">- Không chọn -</option>
          <option value="MALE" ${candidate.gender === 'MALE' ? 'selected' : ''}>Nam</option>
          <option value="FEMALE" ${candidate.gender === 'FEMALE' ? 'selected' : ''}>Nữ</option>
          <option value="OTHER" ${candidate.gender === 'OTHER' ? 'selected' : ''}>Khác</option>
        </select></div>
      <div><label class="block text-xs font-bold uppercase text-slate-500 mb-1">Số điện thoại</label>
        <input id="mp-phone" value="${escapeHtml(candidate.phone)}" class="w-full px-3.5 py-2 border border-slate-200 rounded-xl text-sm"></div>
      <div><label class="block text-xs font-bold uppercase text-slate-500 mb-1">Email</label>
        <input value="${escapeHtml(candidate.email)}" disabled class="w-full px-3.5 py-2 border border-slate-200 rounded-xl text-sm bg-slate-50 text-slate-400"></div>
      <div><label class="block text-xs font-bold uppercase text-slate-500 mb-1">Tóm tắt kỹ năng</label>
        <textarea id="mp-skills" rows="2" class="w-full px-3.5 py-2 border border-slate-200 rounded-xl text-sm">${escapeHtml(candidate.skills_summary || '')}</textarea></div>
      <div><label class="block text-xs font-bold uppercase text-slate-500 mb-1">Tóm tắt kinh nghiệm</label>
        <textarea id="mp-experience" rows="2" class="w-full px-3.5 py-2 border border-slate-200 rounded-xl text-sm">${escapeHtml(candidate.experience_summary || '')}</textarea></div>
      <div class="pt-2 flex justify-end gap-3">
        <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-200 rounded-xl text-sm font-semibold">Hủy</button>
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-xl text-sm font-bold">Lưu</button>
      </div>
    </form>`, 'max-w-lg');
    }

    async function handleSaveMyProfile(event, candidateBusinessId) {
      event.preventDefault();
      try {
        await api(`/candidates/${candidateBusinessId}`, {
          method: 'PUT',
          body: {
            full_name: val('mp-fullname'),
            gender: val('mp-gender') || null,
            phone: val('mp-phone') || null,
            skills_summary: val('mp-skills') || null,
            experience_summary: val('mp-experience') || null,
          },
        });
        showToast('Cập nhật thông tin cá nhân thành công.', 'success');
        closeModal();
      } catch (err) { apiErrorToast(err, 'Cập nhật thất bại: '); }
    }

    async function openMyApplicationDetail(appBusinessId) {
      const app = await api(`/applications/${appBusinessId}`);
      let offerHtml = '';
      if (['OFFER', 'HIRED'].includes(app.status)) {
        try {
          const offers = await api(`/offers?application_business_id=${appBusinessId}`);
          const offer = offers[0];
          if (offer) offerHtml = renderCandidateOfferSection(offer);
        } catch (e) { /* khong co offer */ }
      }

      const timeline = PIPELINE_ORDER.map(s => {
        const reached = PIPELINE_ORDER.indexOf(app.status) >= PIPELINE_ORDER.indexOf(s) && !['REJECTED', 'WITHDRAWN', 'ARCHIVED'].includes(app.status);
        return `<div class="flex items-center gap-2"><div class="w-2.5 h-2.5 rounded-full ${reached ? 'bg-indigo-600' : 'bg-slate-200'}"></div><span class="text-xs ${reached ? 'font-bold text-slate-700' : 'text-slate-400'}">${STATUS_LABEL[s]}</span></div>`;
      }).join('<div class="flex-1 h-px bg-slate-200 mx-1"></div>');

      const canWithdraw = ['NEW', 'SCREENING', 'SHORTLISTED', 'INTERVIEW'].includes(app.status);

      renderModal(`
    <div class="p-5 border-b border-slate-100 flex justify-between items-center">
      <div>
        <h3 class="font-bold text-lg">${escapeHtml(app.job_title)}</h3>
        <p class="text-[11px] text-slate-400 mt-0.5">Mã hồ sơ ứng tuyển: ${app.business_id}</p>
      </div>
      <button onclick="closeModal()"><i class="fa-solid fa-xmark text-xl text-slate-400"></i></button>
    </div>
    <div class="p-6 space-y-6">
      <div class="flex items-center flex-wrap gap-1">${['REJECTED', 'WITHDRAWN', 'ARCHIVED'].includes(app.status) ? `<span class="text-xs font-bold text-rose-600">Trạng thái kết thúc: ${STATUS_LABEL[app.status]}</span>` : timeline}</div>
      <div class="border-t border-slate-100 pt-4 space-y-3">
        <div><h4 class="font-bold text-xs uppercase text-slate-500 mb-1">Mô tả công việc</h4><p class="text-sm text-slate-600 whitespace-pre-wrap">${escapeHtml(app.job_description)}</p></div>
        <div><h4 class="font-bold text-xs uppercase text-slate-500 mb-1">Yêu cầu ứng viên</h4><p class="text-sm text-slate-600 whitespace-pre-wrap">${escapeHtml(app.job_requirements)}</p></div>
      </div>
      ${renderResumeSection(app)}
      ${!['REJECTED', 'WITHDRAWN', 'ARCHIVED', 'HIRED'].includes(app.status) ? `
      <div class="border-t border-slate-100 pt-4">
        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">${app.has_resume ? 'Cập nhật CV (PDF/DOCX)' : 'Tải lên CV (PDF/DOCX)'}</label>
        <div class="flex gap-2">
          <input type="file" id="my-resume-file" accept=".pdf,.docx" class="flex-1 p-2 border border-slate-200 rounded-xl text-xs bg-slate-50">
          <button onclick="uploadMyResume('${app.business_id}')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-xs font-bold">Tải lên</button>
        </div>
      </div>` : ''}
      ${offerHtml}
      ${canWithdraw ? `<button onclick="withdrawApplication('${app.business_id}')" class="w-full border border-rose-200 text-rose-600 hover:bg-rose-50 py-2 rounded-xl text-sm font-bold">Rút hồ sơ ứng tuyển</button>` : ''}
    </div>`, 'max-w-xl');
    }

    async function uploadMyResume(appBusinessId) {
      const fileInput = document.getElementById('my-resume-file');
      if (!fileInput || !fileInput.files.length) { showToast('Vui lòng chọn file trước.', 'info'); return; }
      try {
        await apiUploadFile(`/applications/${appBusinessId}/resume`, fileInput.files[0]);
        showToast('Đã tải lên CV.', 'success');
        openMyApplicationDetail(appBusinessId);
      } catch (err) { apiErrorToast(err, 'Tải lên CV thất bại: '); }
    }

    function renderResumeSection(app) {
      if (!app.has_resume) return '';
      return `
    <div class="border-t border-slate-100 pt-4">
      <h4 class="font-bold text-sm text-slate-700 mb-2">
        <i class="fa-solid fa-file-lines text-slate-400 mr-1"></i> CV${app.resume_file_name ? `: ${escapeHtml(app.resume_file_name)}` : ''}
      </h4>
      ${app.resume_text ? `<p class="text-xs text-slate-600 bg-slate-50 border border-slate-200 rounded-xl p-3 whitespace-pre-line max-h-40 overflow-y-auto">${escapeHtml(app.resume_text)}</p>` : `<p class="text-xs text-amber-600 bg-amber-50 border border-amber-200 rounded-xl p-3">Không trích xuất được nội dung text từ file (có thể là PDF dạng ảnh scan) - cần xem thủ công.</p>`}
    </div>`;
    }

    function renderCandidateOfferSection(offer) {
      const canRespond = offer.status === 'SENT';
      return `
    <div class="border border-indigo-100 bg-indigo-50/50 rounded-xl p-4 space-y-3">
      <h4 class="font-bold text-sm text-indigo-700">Thư mời nhận việc - ${escapeHtml(offer.job_title || '')}</h4>
      <div class="text-xs text-slate-600 space-y-1">
        <p>Trạng thái: <span class="font-bold">${OFFER_STATUS_LABEL[offer.status]}</span></p>
        <p>Lương chính thức: <span class="font-bold">${Number(offer.salary).toLocaleString('vi-VN')} VNĐ</span></p>
        <p>Lương thử việc: <span class="font-bold">${Number(offer.probation_salary).toLocaleString('vi-VN')} VNĐ</span></p>
      </div>
      ${canRespond ? `
      <div class="flex gap-2 pt-2">
        <button onclick="respondOffer('${offer.business_id}', true)" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-xl text-xs font-bold">Chấp nhận Offer</button>
        <button onclick="respondOffer('${offer.business_id}', false)" class="flex-1 bg-white border border-rose-200 text-rose-600 hover:bg-rose-50 py-2 rounded-xl text-xs font-bold">Từ chối</button>
      </div>` : ''}
    </div>`;
    }

    async function respondOffer(offerBusinessId, accept) {
      try {
        await api(`/offers/${offerBusinessId}/respond`, { method: 'POST', body: { response: accept ? 'ACCEPTED' : 'DECLINED' } });
        showToast(accept ? 'Đã chấp nhận Offer! Chúc mừng.' : 'Đã từ chối Offer.', 'success');
        closeModal(); switchTab('my-applications');
      } catch (err) { apiErrorToast(err, 'Phản hồi Offer thất bại: '); }
    }

    async function withdrawApplication(appBusinessId) {
      if (!confirm('Bạn chắc chắn muốn rút hồ sơ ứng tuyển này?')) return;
      try {
        await api(`/applications/${appBusinessId}/withdraw`, { method: 'PUT' });
        showToast('Đã rút hồ sơ.', 'success');
        closeModal(); switchTab('my-applications');
      } catch (err) { apiErrorToast(err, 'Rút hồ sơ thất bại: '); }
    }

    /* ==================================================================
       PIPELINE / KANBAN (HR, HR_MANAGER, ADMIN)
       ================================================================== */
    let pipelineFilters = { job_business_id: '', search: '' };
    let pipelineViewMode = localStorage.getItem('ats_pipeline_view') || 'kanban'; // Kanban | Table

    function matchScoreBadge(score) {
      if (score === null || score === undefined) return '';
      const cls = score >= 80 ? 'bg-emerald-100 text-emerald-700' : score >= 60 ? 'bg-amber-100 text-amber-700' : 'bg-rose-100 text-rose-700';
      return `<span class="text-[10px] font-bold px-1.5 py-0.5 rounded-full ${cls}"><i class="fa-solid fa-wand-magic-sparkles mr-0.5"></i>${score}</span>`;
    }

    function setPipelineViewMode(mode) {
      pipelineViewMode = mode;
      localStorage.setItem('ats_pipeline_view', mode);
      renderPipelineTab();
    }

    function renderKanbanColumns(apps) {
      return KANBAN_COLUMNS.map(status => {
        const items = apps.filter(a => a.status === status);
        return `
      <div class="kanban-col shrink-0 bg-slate-100 rounded-2xl p-3 flex flex-col" data-status="${status}"
           ondragover="event.preventDefault(); this.classList.add('drag-over')"
           ondragleave="this.classList.remove('drag-over')"
           ondrop="handleKanbanDrop(event, '${status}')">

        </h4>
        <div class="space-y-2 min-h-[80px]">
          ${items.map(a => `
            <div class="kanban-card bg-white rounded-xl p-3 shadow-sm border border-slate-200 text-xs space-y-1.5"
                 draggable="true" ondragstart="draggedApp='${a.business_id}'; this.classList.add('dragging')" ondragend="this.classList.remove('dragging')"
                 onclick="openHrApplicationDetail('${a.business_id}')">
              <div class="flex items-start justify-between gap-1">
                <p class="font-bold text-slate-700 leading-tight">${escapeHtml(a.candidate_full_name)}</p>
                ${matchScoreBadge(a.match_score)}
              </div>
              <p class="text-slate-400 truncate">${escapeHtml(a.candidate_email)}</p>

                <span class="flex items-center gap-1.5">
                  ${a.has_resume ? '<i class="fa-solid fa-file-lines text-slate-400" title="Có CV"></i>' : '<i class="fa-regular fa-file text-slate-300" title="Chưa có CV"></i>'}
                  ${a.needs_manual_review ? '<i class="fa-solid fa-triangle-exclamation text-amber-500" title="Cần sàng lọc thủ công"></i>' : ''}
                </span>
              </div>
            </div>`).join('')}
        </div>
      </div>`;
      }).join('');
    }

    // Che do Table thay the/bo sung Kanban - 6 cot bat buoc: Ung vien / Vi
    // tri / Phong ban / Giai doan / Nguon / Thao tac.
    const GENDER_LABEL = { MALE: 'Nam', FEMALE: 'Nữ', OTHER: 'Khác' };

    function renderCandidateTable(apps) {
      const role = state.currentUser.role;
      const canEdit = role === 'HR' || role === 'HR_MANAGER' || role === 'ADMIN';
      const canArchive = role === 'HR_MANAGER' || role === 'ADMIN';
      const activeSources = (state.cache.sources || []).filter(s => s.status === 'ACTIVE');

      if (!apps.length) {
        return `<div class="bg-white rounded-2xl border border-slate-200 p-16 text-center text-slate-400 text-sm">Không tìm thấy ứng viên phù hợp.</div>`;
      }

      // Giai doan va Nguon la COMBOBOX song song voi Kanban (cung
      // KANBAN_COLUMNS - dong bo State Machine that, khong hardcode rieng
      // cho Table) va cung API PUT /applications/{id}/status. Nguon lay tu
      // System Configuration (candidate_sources ACTIVE) qua PUT /applications/{id}.
      // Neu Application.status hien tai KHONG con trong danh sach ACTIVE cua
      // nguon (source bi disable sau khi da chon) van hien thi de khong mat du lieu.
      const rows = apps.map(a => {
        const sourceOptions = activeSources.some(s => s.business_id === a.source_business_id)
          ? activeSources
          : (a.source_business_id ? [{ business_id: a.source_business_id, name: a.source || a.source_business_id }, ...activeSources] : activeSources);
        return `

        <p class="text-[11px] text-slate-400">${escapeHtml(a.candidate_email)}</p>
        <p class="text-[11px] text-slate-400">${escapeHtml(a.candidate_phone)}</p>
      </td>
      <td class="py-3 px-4 text-slate-600 text-xs">${a.candidate_gender ? (GENDER_LABEL[a.candidate_gender] || a.candidate_gender) : '-'}</td>
      <td class="py-3 px-4 text-slate-600">
        <p>${escapeHtml(a.job_title)}</p>
        <p class="text-[11px] text-slate-400">${escapeHtml(a.job_business_id)} · ${escapeHtml(a.department_name || '-')}</p>
      </td>
      <td class="py-3 px-4 text-slate-600 text-xs">${a.desired_salary != null ? fmtSalaryValue(a.desired_salary) : '-'}</td>
      <td class="py-3 px-4">
        ${canEdit
            ? `<select onchange="handleTableStageChange(this, '${a.business_id}', '${a.status}')" class="text-[11px] font-bold px-2 py-1 rounded-lg border border-slate-200 bg-indigo-50 text-indigo-600">
              ${KANBAN_COLUMNS.map(s => `<option value="${s}" ${s === a.status ? 'selected' : ''}>${STATUS_LABEL[s]}</option>`).join('')}
            </select>`
            : `<span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-600">${STATUS_LABEL[a.status] || a.status}</span>`}
      </td>
      <td class="py-3 px-4">
        ${canEdit
            ? `<select onchange="handleTableSourceChange(this, '${a.business_id}')" class="text-[11px] font-bold px-2 py-1 rounded-lg border border-slate-200 bg-slate-50 text-slate-600">
              <option value="">- Chưa chọn -</option>
              ${sourceOptions.map(s => `<option value="${s.business_id}" ${s.business_id === a.source_business_id ? 'selected' : ''}>${escapeHtml(s.name)}</option>`).join('')}

            : `<span class="text-xs text-slate-500">${escapeHtml(a.source || '-')}</span>`}
      </td>
      <td class="py-3 px-4 text-slate-500 text-xs max-w-[160px]">
        <p class="truncate" title="${escapeHtml(a.candidate_skills_summary || '')}">${escapeHtml(a.candidate_skills_summary || '-')}</p>
      </td>
      <td class="py-3 px-4 text-slate-500 text-xs max-w-[160px]">
        <p class="truncate" title="${escapeHtml(a.candidate_experience_summary || '')}">${escapeHtml(a.candidate_experience_summary || '-')}</p>
      </td>
      <td class="py-3 px-4">
        <button onclick="openAIAnalysisModal('${a.business_id}', '${escapeHtml(a.candidate_full_name).replace(/'/g, "\\'")}')" class="text-[11px] font-bold px-2 py-1 rounded-lg border border-indigo-200 text-indigo-600 hover:bg-indigo-50">
          <i class="fa-solid fa-brain mr-1"></i>Xem AI
        </button>
      </td>
      <td class="py-3 px-4">
        <div class="flex items-center gap-3 text-xs font-bold">
          <button onclick="openCandidateEditModal('${a.business_id}')" class="text-indigo-600 hover:underline" title="Sửa">Sửa</button>
          <button onclick="openSendEmailModal('${a.business_id}')" class="text-emerald-600 hover:underline" title="Gửi Email">Gửi Email</button>
          ${canArchive
            ? `<button onclick="handleArchiveApplicationFromTable('${a.business_id}')" class="text-rose-600 hover:underline" title="Xóa (lưu trữ)">Xóa</button>`
            : `<button disabled class="text-slate-300 cursor-not-allowed" title="Chỉ HR Manager/Admin được lưu trữ hồ sơ">Xóa</button>`}
        </div>
      </td>
    </tr>`;
      }).join('');

      return `
    <div class="bg-white rounded-2xl border border-slate-200 overflow-x-auto">
      <table class="w-full text-left">
        <thead class="bg-slate-50 text-[11px] uppercase text-slate-500 font-bold">
          <tr>
            <th class="py-3 px-4">Ứng viên</th><th class="py-3 px-4">Giới tính</th><th class="py-3 px-4">Vị trí</th>

    async function handleTableStageChange(selectEl, appId, oldStatus) {
      const newStatus = selectEl.value;
      if (newStatus === oldStatus) return;

      const isBackward = PIPELINE_ORDER.includes(oldStatus) && PIPELINE_ORDER.includes(newStatus)
        && PIPELINE_ORDER.indexOf(newStatus) < PIPELINE_ORDER.indexOf(oldStatus);
      let reason = null;
      if (isBackward) {
        reason = prompt('Đây là thao tác LÙI trạng thái - chỉ HR Manager/Admin được phép, cần nhập lý do:');
        if (!reason) { selectEl.value = oldStatus; showToast('Đã hủy - cần lý do để lùi trạng thái.', 'info'); return; }
      }
      try {
        await api(`/applications/${appId}/status`, { method: 'PUT', body: { status: newStatus, reason } });
        showToast(`${appId} → ${STATUS_LABEL[newStatus]}`, 'success');
        renderPipelineTab();
      } catch (err) { selectEl.value = oldStatus; showToast(translateStatusChangeError(err), 'error'); }
    }

        <div class="relative flex-1">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i class="fa-solid fa-magnifying-glass text-xs"></i></span>
          <input id="pipeline-search" type="text" value="${escapeHtml(pipelineFilters.search)}" placeholder="Tìm theo tên, email, SĐT ứng viên..."
                 class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm" onkeydown="if(event.key==='Enter') applyPipelineFilters()">
        </div>
        <select id="pipeline-job-filter" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm min-w-[220px]">
          <option value="">Tất cả vị trí</option>
          ${jobs.map(j => `<option value="${j.business_id}" ${pipelineFilters.job_business_id === j.business_id ? 'selected' : ''}>${escapeHtml(j.title)}</option>`).join('')}

        <div class="flex bg-slate-100 rounded-xl p-1 shrink-0">

          ${toggleBtn('table', 'fa-table-list', 'Bảng')}

           <p class="text-[11px] text-slate-400">Kéo / thả để thay đổi trạng thái. Thao tác không hợp lệ sẽ bị từ chối.</p>`

    </div>`;

    function applyPipelineFilters() {
      pipelineFilters.search = val('pipeline-search');
      pipelineFilters.job_business_id = val('pipeline-job-filter');
      renderPipelineTab();
    }

    function clearPipelineFilters() {
      pipelineFilters = { job_business_id: '', search: '' };
      renderPipelineTab();
    }

    let draggedApp = null;

    // Dich cac ma loi tu application_service.update_status() sang tieng Viet ro
    // rang cho nguoi dung cuoi (truoc day hien thang ma loi thô nhu
    // "INVALID_STATUS_TRANSITION: NEW -> HIRED" - khong ai ngoai dev doc hieu duoc).
    function translateStatusChangeError(err) {
      const msg = err.message || '';
      if (msg.startsWith('INVALID_STATUS_TRANSITION')) {
        const m = msg.match(/INVALID_STATUS_TRANSITION:\s*(\w+)\s*->\s*(\w+)/);
        const from = m ? (STATUS_LABEL[m[1]] || m[1]) : '';
        const to = m ? (STATUS_LABEL[m[2]] || m[2]) : '';
        return `Không thể chuyển từ "${from}" sang "${to}" - thao tác không hợp lệ theo quy trình tuyển dụng.`;
      }
      if (msg === 'ONLY_HR_MANAGER_OR_ADMIN_CAN_REVERT') return 'Chỉ HR Manager/Admin mới được lùi giai đoạn.';
      if (msg === 'REASON_REQUIRED_FOR_REVERT') return 'Cần nhập lý do khi lùi giai đoạn.';
      if (msg === 'INSUFFICIENT_PERMISSION') return 'Bạn không có quyền thực hiện thao tác này.';
      return msg || 'Đã có lỗi xảy ra.';
    }

    function translateInterviewError(err) {
      const msg = err.message || '';
      const map = {
        START_TIME_MUST_BE_BEFORE_END_TIME: 'Thời gian bắt đầu phải trước thời gian kết thúc.',
        INTERVIEW_TIME_CONFLICT: 'Trùng lịch phỏng vấn - ứng viên hoặc người phỏng vấn đã có lịch khác trong khoảng thời gian này.',
        INVALID_INTERVIEW_TYPE: 'Hình thức phỏng vấn không hợp lệ.',
        INVALID_STATUS: 'Trạng thái không hợp lệ.',
        INVALID_DATETIME_FORMAT: 'Định dạng ngày giờ không hợp lệ.',
        INTERVIEW_NOT_FOUND: 'Không tìm thấy lịch phỏng vấn.',
        APPLICATION_NOT_FOUND: 'Không tìm thấy hồ sơ ứng tuyển.',
        NOT_YOUR_ASSIGNED_APPLICATION: 'Hồ sơ này không thuộc phạm vi bạn được phân công.',
        INTERVIEWER_NOT_FOUND: 'Người phỏng vấn không hợp lệ.',
        ONLY_CANDIDATE_HAS_MY_INTERVIEWS: 'Chức năng này chỉ dành cho ứng viên.',
        NOT_YOUR_INTERVIEW: 'Đây không phải lịch phỏng vấn của bạn.',
      };
      return map[msg] || msg || 'Đã có lỗi xảy ra.';
    }

    async function handleKanbanDrop(event, newStatus) {
      event.preventDefault();
      event.currentTarget.classList.remove('drag-over');
      if (!draggedApp) return;
      const appId = draggedApp; draggedApp = null;

      const app = state.cache.applications.find(a => a.business_id === appId);
      if (!app || app.status === newStatus) return;

      const isBackward = PIPELINE_ORDER.includes(app.status) && PIPELINE_ORDER.includes(newStatus)
        && PIPELINE_ORDER.indexOf(newStatus) < PIPELINE_ORDER.indexOf(app.status);

      let reason = null;
      if (isBackward) {
        reason = prompt('Đây là thao tác LÙI trạng thái - chỉ HR Manager/Admin được phép, cần nhập lý do:');
        if (!reason) { showToast('Đã hủy - cần lý do để lùi trạng thái.', 'info'); return; }
      }

      try {
        await api(`/applications/${appId}/status`, { method: 'PUT', body: { status: newStatus, reason } });
        showToast(`${appId} → ${STATUS_LABEL[newStatus]}`, 'success');
        renderPipelineTab();
      } catch (err) { showToast(translateStatusChangeError(err), 'error'); }
    }

    async function openHrApplicationDetail(appBusinessId) {
      const app = await api(`/applications/${appBusinessId}`);
      let offers = [];
      try { offers = await api(`/offers?application_business_id=${appBusinessId}`); } catch (e) { }
      const currentOffer = offers[0];
      let aiHistory = [];
      try { aiHistory = await api(`/ai/analysis/${appBusinessId}`); } catch (e) { }

      renderModal(`
    <div class="p-5 border-b border-slate-100 flex justify-between items-center">
      <div>
        <h3 class="font-bold text-lg">${escapeHtml(app.candidate_full_name)}</h3>
        <p class="text-xs text-slate-400">${app.business_id} · ${escapeHtml(app.candidate_email)} · ${escapeHtml(app.candidate_phone)}</p>
      </div>
      <button onclick="closeModal()"><i class="fa-solid fa-xmark text-xl text-slate-400"></i></button>
    </div>
    <div class="p-6 space-y-5">
      <div class="flex items-center justify-between flex-wrap gap-2">
        <div class="flex items-center gap-2">
          <span class="text-xs font-bold text-slate-500">Trạng thái:</span>
          <span class="text-xs font-bold px-2 py-1 rounded-full bg-indigo-50 text-indigo-600">${STATUS_LABEL[app.status]}</span>
          <span class="text-xs text-slate-400">· Vị trí: <span class="font-semibold text-slate-600">${escapeHtml(app.job_title)}</span></span>
        </div>
        <button onclick="openSendEmailModal('${app.business_id}')" class="bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 px-3 py-1.5 rounded-xl text-xs font-bold">
          <i class="fa-solid fa-paper-plane mr-1 text-indigo-500"></i> Gửi Email
        </button>
      </div>
      ${renderResumeSection(app)}
      <div id="ai-section">${renderAiSection(app, aiHistory[0])}</div>
      <div id="offer-section">${renderHrOfferSection(app, currentOffer)}</div>
      ${renderArchiveSection(app)}
    </div>`, 'max-w-xl');
    }

    function renderAiSection(app, latestAnalysis) {
      const canRun = ['NEW', 'SCREENING'].includes(app.status) || !latestAnalysis;
      const btn = `<button onclick="runAiAnalyze('${app.business_id}')" id="btn-run-ai" class="text-xs font-bold text-indigo-600 hover:underline"><i class="fa-solid fa-wand-magic-sparkles mr-1"></i>${latestAnalysis ? 'Phân tích lại' : 'Chạy AI phân tích'}</button>`;

      if (!latestAnalysis) {
        return `
      <div class="border-t border-slate-100 pt-4 flex items-center justify-between">
        <p class="text-xs text-slate-400">Chưa có kết quả phân tích AI cho hồ sơ này.</p>
        ${btn}
      </div>`;
      }

      // Hien thi toan bo field AI da co san trong schema (khong chi Ky nang
      // khop/thieu/Nhan xet - Strengths/Weaknesses/
      // Experience Summary da co san o API nhung chua duoc hien thi).
      return `
    <div class="border-t border-slate-100 pt-4 space-y-3">
      <div class="flex items-center justify-between">
        <h4 class="font-bold text-sm flex items-center gap-2">
          <i class="fa-solid fa-brain text-indigo-600"></i> Phân tích AI
          ${matchScoreBadge(latestAnalysis.match_score)}
        </h4>
        ${btn}
      </div>
      <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs text-slate-700 space-y-2">
        <p><span class="font-bold">Kỹ năng khớp:</span> ${latestAnalysis.matched_skills.join(', ') || '-'}</p>
        <p><span class="font-bold">Kỹ năng thiếu:</span> ${latestAnalysis.missing_skills.join(', ') || '-'}</p>
        <p><span class="font-bold">Điểm mạnh:</span> ${(latestAnalysis.strengths || []).join(', ') || '-'}</p>
        <p><span class="font-bold">Điểm yếu:</span> ${(latestAnalysis.weaknesses || []).join(', ') || '-'}</p>
        <p><span class="font-bold">Tóm tắt kinh nghiệm:</span> ${escapeHtml(latestAnalysis.experience_summary || '-')}</p>
        <p><span class="font-bold">Nhận xét/Đề xuất:</span> ${escapeHtml(latestAnalysis.recommendation)}</p>
        <p class="text-slate-400">Model: ${escapeHtml(latestAnalysis.provider)}/${escapeHtml(latestAnalysis.model)} · ${formatDateTime(latestAnalysis.created_at)}</p>
      </div>
    </div>`;
    }

    // "Xem AI" tu Candidate Table - mo Modal rieng (khong nhet het vao 1
    // cell), tai su dung renderAiSection() da co san de nhat quan giao
    // dien voi Application Detail. Candidate KHONG duoc goi ham nay (chi HR+ co
    // nut "Xem AI" tren Table - da kiem tra o renderCandidateTable).
    async function openAIAnalysisModal(appBusinessId, candidateName) {
      let app, aiHistory = [];
      try {
        app = await api(`/applications/${appBusinessId}`);
        aiHistory = await api(`/ai/analysis/${appBusinessId}`);
      } catch (err) { apiErrorToast(err, 'Không tải được phân tích AI: '); return; }

      renderModal(`
    <div class="p-5 border-b border-slate-100 flex justify-between items-center">
      <h3 class="font-bold text-lg">Phân tích AI - ${escapeHtml(candidateName)}</h3>
      <button onclick="closeModal()"><i class="fa-solid fa-xmark text-xl text-slate-400"></i></button>
    </div>
    <div class="p-6" id="ai-modal-section">${renderAiSection(app, aiHistory[0])}</div>
    ${aiHistory.length > 1 ? `
      <div class="px-6 pb-6">
        <h4 class="text-xs font-bold uppercase text-slate-500 mb-2">Lịch sử phân tích (${aiHistory.length} lần)</h4>
        <div class="space-y-1">
          ${aiHistory.map(h => `<p class="text-[11px] text-slate-400">${h.business_id} · ${matchScoreBadge(h.match_score)} · ${formatDateTime(h.created_at)} ${h.is_latest ? '(mới nhất)' : ''}</p>`).join('')}
        </div>
      </div>` : ''}`, 'max-w-lg');
    }

    async function runAiAnalyze(appBusinessId) {
      const btn = document.getElementById('btn-run-ai');
      if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i>Đang phân tích...'; }
      try {
        const result = await api(`/ai/analyze/${appBusinessId}`, { method: 'POST' });
        if (result && result.needs_manual_review) {
          showToast('Không có nội dung CV để phân tích - cần sàng lọc thủ công.', 'info');
        } else {
          showToast('Đã có kết quả phân tích AI.', 'success');
        }
        openHrApplicationDetail(appBusinessId);
        if (state.activeTab === 'pipeline') renderPipelineTab();
      } catch (err) { apiErrorToast(err, 'Phân tích AI thất bại: '); }
    }

    function renderArchiveSection(app) {
      const me = state.currentUser;
      if (me.role !== 'HR_MANAGER' && me.role !== 'ADMIN') return '';
      if (app.status === 'HIRED' || app.status === 'ARCHIVED') return '';
      return `
    <div class="border-t border-slate-100 pt-4">
      <button onclick="archiveApplication('${app.business_id}')" class="w-full border border-slate-200 text-slate-600 hover:bg-slate-50 py-2 rounded-xl text-xs font-bold">
        <i class="fa-solid fa-box-archive mr-1"></i> Lưu trữ hồ sơ (Archive)
      </button>
    </div>`;
    }

    async function archiveApplication(appBusinessId) {
      const isTalentPool = confirm('OK = Lưu vào Talent Pool (có thể liên hệ lại sau)\nCancel = Lưu trữ vì bị từ chối (REJECTED_ARCHIVE)');
      const archive_reason = isTalentPool ? 'TALENT_POOL' : 'REJECTED_ARCHIVE';
      try {
        await api(`/applications/${appBusinessId}/archive`, { method: 'PUT', body: { archive_reason } });
        showToast('Đã lưu trữ hồ sơ.', 'success');
        closeModal();
        if (state.activeTab === 'pipeline') renderPipelineTab();
      } catch (err) { apiErrorToast(err, 'Lưu trữ thất bại: '); }
    }

    function renderHrOfferSection(app, offer) {
      const me = state.currentUser;
      const canApprove = me.role === 'HR_MANAGER' || me.role === 'ADMIN';

      if (!offer) {
        if (app.status !== 'INTERVIEW') {
          return `<p class="text-xs text-slate-400 border-t border-slate-100 pt-4">Chỉ có thể tạo Offer khi hồ sơ đang ở trạng thái Phỏng vấn (INTERVIEW).</p>`;
        }
        return `
      <div class="border-t border-slate-100 pt-4">
        <h4 class="font-bold text-sm mb-3">Tạo Offer mới</h4>
        <form onsubmit="handleCreateOffer(event, '${app.business_id}')" class="space-y-3">
          <div class="grid grid-cols-2 gap-3">
            <div><label class="block text-[11px] font-bold uppercase text-slate-500 mb-1">Lương chính thức *</label>
              <input id="offer-salary" type="number" required class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm"></div>
            <div><label class="block text-[11px] font-bold uppercase text-slate-500 mb-1">Lương thử việc *</label>
              <input id="offer-probation-salary" type="number" required class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm"></div>
          </div>
          <div><label class="block text-[11px] font-bold uppercase text-slate-500 mb-1">Ngày bắt đầu *</label>
            <input id="offer-start-date" type="date" required class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm"></div>
          <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-xl text-sm font-bold">Tạo Offer (nháp)</button>
        </form>
      </div>`;
      }

      const isCreator = offer.creator_business_id === me.business_id;
      let actions = '';
      if (offer.status === 'DRAFT') {
        actions = `<button onclick="submitOffer('${offer.business_id}', '${app.business_id}')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-xl text-xs font-bold">Gửi yêu cầu duyệt</button>`;
      } else if (offer.status === 'PENDING_APPROVAL') {
        if (canApprove && !isCreator) {
          actions = `
        <div class="flex gap-2">
          <button onclick="approveOffer('${offer.business_id}', '${app.business_id}')" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-xl text-xs font-bold">Duyệt Offer</button>
          <button onclick="rejectOffer('${offer.business_id}', '${app.business_id}')" class="flex-1 bg-white border border-rose-200 text-rose-600 py-2 rounded-xl text-xs font-bold">Từ chối</button>
        </div>`;
        } else if (canApprove && isCreator) {
          actions = `<p class="text-[11px] text-amber-600 bg-amber-50 border border-amber-200 rounded-xl p-2">Bạn là người tạo Offer này, bạn KHÔNG thể tự duyệt. Cần một HR Manager/Admin khác duyệt.</p>`;
        } else {
          actions = `<p class="text-[11px] text-slate-400">Đang chờ HR Manager/Admin duyệt.</p>`;
        }
      } else if (offer.status === 'APPROVED') {
        actions = `<button onclick="sendOffer('${offer.business_id}', '${app.business_id}')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-xl text-xs font-bold">Gửi Offer cho ứng viên</button>`;
      }

      return `
    <div class="border-t border-slate-100 pt-4 space-y-3">
      <h4 class="font-bold text-sm">Thư mời nhận việc - ${escapeHtml(offer.job_title || '')}</h4>
      <div class="text-xs text-slate-600 bg-slate-50 rounded-xl p-3 space-y-1">
        <p>Trạng thái: <span class="font-bold">${OFFER_STATUS_LABEL[offer.status]}</span></p>
        <p>Người tạo: <span class="font-bold">${escapeHtml(offer.creator_name || offer.creator_business_id)}</span>${isCreator ? ' (bạn)' : ''}</p>
        ${offer.approver_name ? `<p>Người duyệt: <span class="font-bold">${escapeHtml(offer.approver_name)}</span></p>` : ''}
        <p>Lương: <span class="font-bold">${Number(offer.salary).toLocaleString('vi-VN')} VNĐ</span></p>
      </div>
      ${actions}
    </div>`;
    }

    async function handleCreateOffer(event, appBusinessId) {
      event.preventDefault();
      const payload = {
        application_business_id: appBusinessId,
        salary: val('offer-salary'), probation_salary: val('offer-probation-salary'),
        start_date: val('offer-start-date'),
      };
      try {
        await api('/offers', { method: 'POST', body: payload });
        showToast('Đã tạo Offer (Nháp).', 'success');
        openHrApplicationDetail(appBusinessId);
      } catch (err) { apiErrorToast(err, 'Tạo Offer thất bại: '); }
    }

    async function submitOffer(offerId, appId) {
      try { await api(`/offers/${offerId}/submit`, { method: 'POST' }); showToast('Đã gửi yêu cầu duyệt.', 'success'); openHrApplicationDetail(appId); }
      catch (err) { apiErrorToast(err, 'Gửi duyệt thất bại: '); }
    }
    async function approveOffer(offerId, appId) {
      try { await api(`/offers/${offerId}/approve`, { method: 'POST' }); showToast('Đã duyệt Offer.', 'success'); openHrApplicationDetail(appId); }
      catch (err) { apiErrorToast(err, err.status === 409 ? 'Không thể duyệt: bạn chính là người tạo Offer này' : 'Duyệt thất bại: '); }
    }
    async function rejectOffer(offerId, appId) {
      const reason = prompt('Lý do từ chối Offer (bắt buộc):');
      if (!reason) return;
      try { await api(`/offers/${offerId}/reject`, { method: 'POST', body: { reason } }); showToast('Đã từ chối, Offer quay về DRAFT.', 'success'); openHrApplicationDetail(appId); }
      catch (err) { apiErrorToast(err, 'Từ chối thất bại: '); }
    }
    async function sendOffer(offerId, appId) {
      try { await api(`/offers/${offerId}/send`, { method: 'POST' }); showToast('Đã gửi Offer cho ứng viên.', 'success'); openHrApplicationDetail(appId); }
      catch (err) { apiErrorToast(err, 'Gửi Offer thất bại: '); }
    }

    /* ==================================================================
       OFFERS TAB (HR_MANAGER / ADMIN) - danh sach cho duyet toan he thong
       ================================================================== */
    async function renderOffersTab() {
      const offers = await api('/offers?status=PENDING_APPROVAL');
      const me = state.currentUser;
      if (!offers.length) {
        document.getElementById('tab-content').innerHTML = `<p class="text-slate-400 text-sm text-center py-16">Không có Offer nào đang chờ duyệt.</p>`;
        return;
      }
      const rows = offers.map(o => {
        const isCreator = o.creator_business_id === me.business_id;
        return `
    <div class="bg-white rounded-2xl border border-slate-200 p-5 flex items-center justify-between gap-4">
      <div class="min-w-0">
        <h3 class="font-bold text-slate-800 text-sm">${escapeHtml(o.candidate_full_name)} <span class="text-slate-300">·</span> ${escapeHtml(o.job_title)}</h3>
        <p class="text-[11px] text-slate-400 mt-0.5">${escapeHtml(o.candidate_email)}${o.department_name ? ' · ' + escapeHtml(o.department_name) : ''}</p>
        <div class="flex flex-wrap gap-x-4 gap-y-0.5 text-xs text-slate-500 mt-1.5">
          <span><i class="fa-solid fa-sack-dollar text-slate-400 mr-1"></i>Lương chính thức: <span class="font-bold text-slate-700">${Number(o.salary).toLocaleString('vi-VN')} VNĐ</span></span>
          <span><i class="fa-solid fa-hourglass-half text-slate-400 mr-1"></i>Lương thử việc: <span class="font-bold text-slate-700">${Number(o.probation_salary).toLocaleString('vi-VN')} VNĐ</span></span>
          <span><i class="fa-solid fa-calendar-day text-slate-400 mr-1"></i>Bắt đầu: <span class="font-bold text-slate-700">${formatDate(o.start_date)}</span></span>
        </div>
        <p class="text-[11px] text-slate-400 mt-1">Người tạo: ${escapeHtml(o.creator_name || o.creator_business_id)}${isCreator ? ' (bạn)' : ''}</p>
      </div>
      ${isCreator
            ? `<span class="text-[11px] font-bold text-amber-600 bg-amber-50 border border-amber-200 rounded-full px-3 py-1 shrink-0">Bạn là người tạo - không thể tự duyệt</span>`

    let interviewViewMode = localStorage.getItem('ats_interview_view') || 'list'; // 'list' | 'month'
    const INTERVIEW_TYPE_LABEL = { ONSITE: 'Trực tiếp', ONLINE: 'Trực tuyến' };
    const INTERVIEW_STATUS_LABEL = { SCHEDULED: 'Đã lên lịch', COMPLETED: 'Đã hoàn thành', CANCELLED: 'Đã hủy' };

    function setInterviewViewMode(mode) {

    function renderInterviewListTable(interviews) {
      if (!interviews.length) return `<div class="bg-white rounded-2xl border border-slate-200 p-16 text-center text-slate-400 text-sm">Chưa có lịch phỏng vấn.</div>`;
      const rows = interviews.map(iv => {

        return `

      <td class="py-3 px-4 text-slate-600">${formatTime(start)}</td>
      <td class="py-3 px-4 text-slate-500 text-xs">${INTERVIEW_TYPE_LABEL[iv.interview_type] || iv.interview_type}</td>
      <td class="py-3 px-4 text-slate-600">${escapeHtml(iv.interviewer_name)}</td>
      <td class="py-3 px-4">
        <div class="flex items-center gap-3 text-xs font-bold">
          <button onclick='openEditInterviewModal(${JSON.stringify(iv)})' class="text-indigo-600 hover:underline">Sửa</button>
          ${iv.status !== 'CANCELLED' ? `<button onclick="handleCancelInterview('${iv.business_id}')" class="text-rose-600 hover:underline">Xóa</button>` : `<span class="text-slate-300">${INTERVIEW_STATUS_LABEL[iv.status]}</span>`}
        </div>
      </td>
    </tr>`;
      }).join('');
      return `
    <div class="bg-white rounded-2xl border border-slate-200 overflow-x-auto">
      <table class="w-full text-left">
        <thead class="bg-slate-50 text-[11px] uppercase text-slate-500 font-bold">
          <tr><th class="py-3 px-4">Ứng viên</th><th class="py-3 px-4">Vị trí</th><th class="py-3 px-4">Ngày</th><th class="py-3 px-4">Giờ</th><th class="py-3 px-4">Hình thức</th><th class="py-3 px-4">Người phỏng vấn</th><th class="py-3 px-4">Thao tác</th></tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
    }

    function renderInterviewMonthGrid(interviews) {
      const now = new Date();
      const year = now.getFullYear(), month = now.getMonth();
      const firstDay = new Date(year, month, 1);
      const startOffset = firstDay.getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const byDay = {};
      interviews.forEach(iv => {
        const d = new Date(iv.start_time);
        if (d.getFullYear() === year && d.getMonth() === month) {
          const key = d.getDate();
          (byDay[key] = byDay[key] || []).push(iv);
        }
      });
      let cells = '';
      for (let i = 0; i < startOffset; i++) cells += `<div class="border border-slate-100 bg-slate-50 min-h-[90px]"></div>`;
      for (let day = 1; day <= daysInMonth; day++) {
        const items = byDay[day] || [];
        cells += `
      <div class="border border-slate-100 min-h-[90px] p-1.5 text-xs">
        <p class="font-bold text-slate-500 mb-1">${day}</p>
        ${items.slice(0, 3).map(iv => `<div onclick='openEditInterviewModal(${JSON.stringify(iv)})' class="cursor-pointer truncate bg-indigo-50 text-indigo-600 rounded px-1 mb-0.5 font-semibold" title="${escapeHtml(iv.candidate_full_name)}">${new Date(iv.start_time).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })} ${escapeHtml(iv.candidate_full_name)}</div>`).join('')}
        ${items.length > 3 ? `<p class="text-[10px] text-slate-400">+${items.length - 3} khác</p>` : ''}
      </div>`;
      }
      const weekdays = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
      return `
    <div class="bg-white rounded-2xl border border-slate-200 p-3">
      <p class="text-sm font-bold text-slate-700 mb-2">Tháng ${month + 1}/${year}</p>
      <div class="grid grid-cols-7 gap-px bg-slate-100 text-center text-[11px] font-bold text-slate-400 mb-px">
        ${weekdays.map(w => `<div class="bg-white py-1">${w}</div>`).join('')}
      </div>
      <div class="grid grid-cols-7 gap-px bg-slate-100">${cells}</div>
    </div>`;
    }

      <i class="fa-solid ${icon} mr-1"></i>${label}

      document.getElementById('tab-content').innerHTML = `

    /* ==================================================================
       EXCEL EXPORT (client-side, dung thu vien SheetJS - xuat file .xlsx
       that thay vi .csv, tranh loi font/dinh dang khi nguoi dung mo bang
       Excel - xem lai downloadCsv cu tung phai vat lon voi BOM UTF-8 ma
       Excel ban Windows locale Viet Nam van doi luc doc nham encoding)
       ================================================================== */
function downloadXlsx(filename, headerLabels, rows) {
  const data = headerLabels.length ? [headerLabels, ...rows] : rows;
  const worksheet = XLSX.utils.aoa_to_sheet(data);
  // Do rong cot uoc luong tu do dai noi dung dai nhat trong tung cot, gioi
  // han 60 ky tu de tranh 1 cot qua rong khi co truong van ban dai (VD tom
  // tat kinh nghiem).
  const colCount = data.reduce((max, row) => Math.max(max, row.length), 0);
  worksheet['!cols'] = Array.from({ length: colCount }, (_, colIdx) => {
    const maxLen = data.reduce((m, row) => Math.max(m, String(row[colIdx] ?? '').length), 10);
    return { wch: Math.min(maxLen + 2, 60) };
  });
  const workbook = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(workbook, worksheet, 'Danh sach');
  XLSX.writeFile(workbook, filename);
}

    function val(id) { return document.getElementById(id).value; }
    function escapeHtml(str) {
      const div = document.createElement('div'); div.textContent = str ?? ''; return div.innerHTML;
    }

    // Fix loi lech gio + thieu so 0: backend nay da gui chuoi ISO co hau to
    // +00:00 (xem app/core/time_utils.py) nen new Date(...) quy doi dung ve
    // gio dia phuong may nguoi dung, nhung Intl/toLocaleString('vi-VN') KHONG
    // dam bao zero-pad (VD tra ve "23/8/2026" thay vi "23/08/2026"). Cac ham
    // duoi day tu pad thu cong de luon dung dinh dang dd/mm/yyyy.
    function pad2(n) { return String(n).padStart(2, '0'); }
    function formatDate(value) {
      if (!value) return '';
      const d = value instanceof Date ? value : new Date(value);
      if (isNaN(d.getTime())) return '';
      return `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)}/${d.getFullYear()}`;
    }
    function formatTime(value) {
      if (!value) return '';
      const d = value instanceof Date ? value : new Date(value);
      if (isNaN(d.getTime())) return '';
      return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    }
    function formatDateTime(value) {
      if (!value) return '';
      const d = value instanceof Date ? value : new Date(value);
      if (isNaN(d.getTime())) return '';
      return `${formatDate(d)} ${formatTime(d)}`;
    }

    // input[type=datetime-local] luon hien thi/nhan gia tri theo GIO DIA
    // PHUONG cua trinh duyet (khong co timezone trong chuoi, VD
    // "2026-08-31T20:00"), trong khi backend luu va tra ve moi DateTime theo
    // UTC (xem app/core/time_utils.py). Truoc day form dat lich phong van gui
    // thang gia tri dia phuong nay len server va server hieu nham la gio UTC
    // -> lech dung dung bang chenh lech mui gio (VD nhap 20:00 gio VN, luu
    // thanh 20:00 UTC = 03:00 gio VN NGAY HOM SAU). 2 ham duoi day quy doi 2
    // chieu dung dan qua doi tuong Date cua trinh duyet (Date tu dong hieu
    // chuoi khong timezone la gio dia phuong, va toISOString() luon tra ve
    // UTC) - dung cho ca luc gui len server lan luc do form Sua.
    function toDatetimeLocalValue(isoString) {
      if (!isoString) return '';
      const d = new Date(isoString);
      if (isNaN(d.getTime())) return '';
      return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    }
    function fromDatetimeLocalValue(localValue) {
      if (!localValue) return null;
      const d = new Date(localValue);
      if (isNaN(d.getTime())) return null;
      return d.toISOString();
    }
